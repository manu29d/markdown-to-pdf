<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pastel: {
                bg: '#FDFBF7',
                paper: '#FFFFFF',
                slate: '#F1F5F9',
                text: '#334155',
                primary: '#94A3B8',
                accent: '#E2E8F0',
                green: '#D1FAE5',
                blue: '#DBEAFE',
                rose: '#FFE4E6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page {
          margin: 0;
          size: A4;
        }
        body * {
          visibility: hidden;
        }
        #resume-preview, #resume-preview * {
          visibility: visible;
        }
        #resume-preview {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 40px !important; /* Print padding */
          box-shadow: none !important;
          background: white !important;
          border-radius: 0 !important;
          overflow: visible !important;
        }
        /* Hide UI elements */
        .no-print {
          display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "prismjs/": "https://esm.sh/prismjs@1.29.0/",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "react-simple-code-editor": "https://esm.sh/react-simple-code-editor@0.13.1"
  }
}
</script>
</head>
  <body class="bg-pastel-bg text-pastel-text font-sans antialiased h-screen overflow-hidden">
    <div id="root"></div>
  </body>
</html>
