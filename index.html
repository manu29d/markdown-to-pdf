<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastel Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pastel: {
                bg: '#FDFBF7',
                paper: '#FFFFFF',
                slate: '#F1F5F9',
                text: '#334155',
                primary: '#94A3B8',
                accent: '#E2E8F0',
                green: '#D1FAE5',
                blue: '#DBEAFE',
                rose: '#FFE4E6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page {
          margin: 0;
          size: A4;
        }
        body {
          height: auto;
          overflow: visible;
          background: white;
        }
        
        /* Reset the wrapper to prevent layout interference */
        #preview-container {
          position: static !important;
          display: block !important;
          padding: 0 !important;
          margin: 0 !important;
          height: auto !important;
          width: auto !important;
          overflow: visible !important;
          background: transparent !important;
        }

        #resume-preview {
          position: relative;
          left: auto;
          top: auto;
          width: 100%;
          min-height: 297mm;
          margin: 0 auto;
          padding: 8mm 10mm;
          box-sizing: border-box;
          box-shadow: none;
          background: white;
          border-radius: 0;
          overflow: visible;
        }

        /* H1 Headings */
        #resume-preview h1 {
          font-size: 14pt;
          font-weight: 700;
          border-bottom-width: 2px;
          border-bottom-style: solid;
          padding-bottom: 0.25rem;
          margin-bottom: 0.5rem;
          margin-top: 0.75rem;
          line-height: 1.25;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }

        #resume-preview h1:first-child {
          margin-top: 0;
        }

        /* H2 Headings */
        #resume-preview h2 {
          font-size: 13pt;
          font-weight: 700;
          margin-top: 0.75rem;
          margin-bottom: 0.4rem;
          line-height: 1.375;
        }

        /* H3 Headings */
        #resume-preview h3 {
          font-size: 12pt;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.025em;
          border-bottom-width: 1px;
          border-bottom-style: solid;
          padding-bottom: 0.15rem;
          margin-top: 0.75rem;
          margin-bottom: 0.4rem;
        }

        /* Paragraphs */
        #resume-preview p {
          font-size: 10pt;
          line-height: 1.6;
          margin-bottom: 0.4rem;
        }

        /* Unordered Lists */
        #resume-preview ul {
          list-style-type: disc;
          list-style-position: outside;
          margin-left: 0.8rem;
          margin-bottom: 0.4rem;
          font-size: 10pt;
        }

        /* Ordered Lists */
        #resume-preview ol {
          list-style-type: decimal;
          list-style-position: outside;
          margin-left: 0.8rem;
          margin-bottom: 0.4rem;
          font-size: 10pt;
        }

        /* List Items */
        #resume-preview li {
          margin-bottom: 0.1rem;
          line-height: 1.5;
          padding-left: 0.15rem;
        }

        /* Links */
        #resume-preview a {
          text-decoration: underline;
          text-decoration-thickness: 1px;
          text-underline-offset: 2px;
        }

        /* Horizontal Rules */
        #resume-preview hr {
          border-top-width: 1px;
          border-top-style: solid;
          margin-top: 0.5rem;
          margin-bottom: 0.5rem;
        }

        /* Blockquotes */
        #resume-preview blockquote {
          border-left-width: 4px;
          border-left-style: solid;
          padding-left: 0.5rem;
          font-style: italic;
          margin-top: 0.5rem;
          margin-bottom: 0.5rem;
        }

        /* Strong/Bold */
        #resume-preview strong {
          font-weight: 700;
        }

        /* Emphasis/Italic */
        #resume-preview em {
          font-style: italic;
        }

        /* Page break optimization */
        #resume-preview h1,
        #resume-preview h2,
        #resume-preview h3 {
          page-break-after: avoid;
        }

        /* Remove transitions for print */
        #resume-preview * {
          transition: none !important;
        }

        /* Hide UI elements */
        .no-print {
          display: none !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "@google/genai": "https://esm.sh/@google/genai@0.1.1",
    "prismjs/": "https://esm.sh/prismjs@1.29.0/",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "react-simple-code-editor": "https://esm.sh/react-simple-code-editor@0.13.1"
  }
}
</script>
</head>
  <body class="bg-pastel-bg text-pastel-text font-sans antialiased h-screen overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
